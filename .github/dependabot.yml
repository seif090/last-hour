version: 2

updates:
  # NuGet packages via the central version table (Directory.Packages.props).
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      dotnet:
        patterns:
          - "*"

  # GitHub Actions (keeps pinned action SHAs current).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
